<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>도서 상세 정보</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow p-4">
        <h3 class="mb-4">📚 도서 상세 정보</h3>
        <!-- 도서 정보 테이블 -->
        <table class="table table-bordered" th:object="${book}">
            <tr>
                <th style="width: 150px;">ID</th>
                <td th:text="*{id}">여기에 책 ID 표시</td>
            </tr>
            <tr>
                <th>제목</th>
                <td th:text="*{title}">여기에 책 제목 표시</td>
            </tr>
            <tr>
                <th>저자</th>
                <td th:text="*{author}">여기에 저자 이름 표시</td>
            </tr>
            <tr>
                <th>상태</th>
                <td th:text="*{status}">여기에 상태 표시 (AVAILABLE / BORROWED)</td>
            </tr>
        </table>
        <!-- 버튼 영역 -->
        <div class="d-flex justify-content-between mt-4">
            <!-- 목록 버튼 -->
            <a th:href="@{/books}" class="btn btn-secondary">
                목록으로
            </a>
            <!-- 수정 / 삭제 버튼 -->
            <div>
                <!-- 수정 버튼 -->
                <a th:href="@{/books/{bookId}/edit(bookId=${book.id})}" class="btn btn-primary">
                수정
                </a>
                <!-- 삭제 버튼 (POST 전송용 form) -->
                <form th:action="@{/books/{bookId}/delete(bookId=${book.id})}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-danger">
                        삭제
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
