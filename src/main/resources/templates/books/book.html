<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>도서 상세 정보</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow p-4">
        <h3 class="mb-4">📚 도서 상세 정보</h3>

        <table class="table table-bordered" th:object="${book}">
            <tr>
                <th style="width: 150px;">ID</th>
                <td th:text="*{id}">1</td>
            </tr>
            <tr>
                <th>제목</th>
                <td th:text="*{title}">제목</td>
            </tr>
            <tr>
                <th>저자</th>
                <td th:text="*{author}">저자</td>
            </tr>
            <tr>
                <th>수량</th>
                <td th:text="*{quantity}">3</td>
            </tr>
            <tr>
                <th>상태</th>
                <td th:text="*{status}">AVAILABLE</td>
            </tr>
        </table>

        <!-- 대출/반납 버튼 -->
        <div class="d-flex gap-2 mt-3">
            <!-- 대출 -->
            <form th:action="@{/books/{bookId}/borrow(bookId=${book.id})}" method="post" class="m-0">
                <button type="submit"
                        class="btn btn-warning"
                        th:disabled="${book.quantity == 0}">
                    대출
                </button>
            </form>

            <!-- 반납 -->
            <form th:action="@{/books/{bookId}/return(bookId=${book.id})}" method="post" class="m-0">
                <button type="submit" class="btn btn-success">
                    반납
                </button>
            </form>
        </div>

        <div class="d-flex justify-content-between mt-4">
            <a th:href="@{/books}" class="btn btn-secondary">
                목록으로
            </a>

            <div>
                <a th:href="@{/books/{bookId}/edit(bookId=${book.id})}" class="btn btn-primary">
                    수정
                </a>

                <form th:action="@{/books/{bookId}/delete(bookId=${book.id})}"
                      method="post" style="display:inline;">
                    <button type="submit" class="btn btn-danger">
                        삭제
                    </button>
                </form>
            </div>
        </div>

    </div>
</div>
</body>
</html>
