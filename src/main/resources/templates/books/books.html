<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>도서 목록</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .page-wrap { max-width: 980px; }
        .card { border-radius: 16px; }
        .table thead th { vertical-align: middle; }
    </style>
</head>

<body class="bg-light">

<div class="container page-wrap py-5">

    <div class="card shadow-sm">
        <div class="card-body p-4 p-md-5">

            <div class="d-flex flex-column flex-md-row justify-content-between align-items-start align-items-md-center gap-3 mb-4">
                <div>
                    <h3 class="mb-1">📚 도서 목록</h3>
                    <div class="text-muted">등록된 도서를 확인하고 관리하세요.</div>
                </div>

                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-outline-secondary" onclick="location.href='/'">
                        홈
                    </button>

                    <a th:href="@{/books/add}" class="btn btn-primary">
                        + 도서 등록
                    </a>

                    <form th:action="@{/logout}" method="post" class="m-0">
                        <button type="submit" class="btn btn-outline-danger">로그아웃</button>
                    </form>
                </div>
            </div>

            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th style="width: 8%;">ID</th>
                        <th>제목</th>
                        <th style="width: 22%;">저자</th>
                        <th style="width: 10%;">수량</th>
                        <th style="width: 14%;">상태</th>
                        <th style="width: 12%;">상세</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="book : ${books}">
                        <td class="text-muted" th:text="${book.id}">1</td>
                        <td class="fw-semibold" th:text="${book.title}">스프링 입문</td>
                        <td th:text="${book.author}">김영한</td>

                        <td th:text="${book.quantity}">3</td>
                        <td th:text="${book.status}">AVAILABLE</td>

                        <td>
                            <a th:href="@{/books/{bookId}(bookId=${book.id})}"
                               class="btn btn-sm btn-outline-primary">
                                보기
                            </a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <div th:if="${#lists.isEmpty(books)}" class="text-center text-muted py-5">
                등록된 도서가 없습니다.
            </div>

        </div>
    </div>

</div>

</body>
</html>
