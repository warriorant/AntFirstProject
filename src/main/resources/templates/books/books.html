<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>도서 목록</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow p-4">
        <!-- 상단 영역 -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3>📚 도서 목록</h3>
            <!-- 등록 버튼 -->
            <a th:href="@{/books/add}" class="btn btn-primary">
                도서 등록
            </a>
        </div>
        <!-- 도서 테이블 -->
        <table class="table table-hover">
            <thead class="table-dark">
            <tr>
                <th style="width: 10%;">ID</th>
                <th style="width: 40%;">제목</th>
                <th style="width: 25%;">저자</th>
                <th style="width: 15%;">상태</th>
                <th style="width: 10%;">상세</th>
            </tr>
            </thead>
            <tbody>
            <!-- 도서 반복 출력 -->
            <tr th:each="book : ${books}">
                <td th:text="${book.id}">1</td>
                <td th:text="${book.title}">스프링 입문</td>
                <td th:text="${book.author}">김영한</td>
                <td th:text="${book.status}">AVAILABLE</td>
                <!-- 상세 보기 버튼 -->
                <td>
                    <a th:href="@{/books/{bookId}(bookId=${book.id})}"
                       class="btn btn-sm btn-info">
                        보기
                    </a>
                </td>
            </tr>
            </tbody>
        </table>
        <!-- 데이터 없을 때 표시 -->
        <div th:if="${#lists.isEmpty(books)}"
             class="text-center text-muted mt-3">
            등록된 도서가 없습니다.
        </div>
    </div>
</div>
</body>
</html>
