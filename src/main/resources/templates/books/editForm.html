<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>도서 수정</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow p-4">

        <h3 class="mb-4">✏️ 도서 수정</h3>

        <form th:action="@{/books/{bookId}/edit(bookId=${book.id})}"
              th:object="${book}" method="post">

            <!-- ID (hidden) -->
            <input type="hidden" th:field="*{id}"/>

            <!-- 제목 -->
            <div class="mb-3">
                <label class="form-label">제목</label>
                <input type="text"
                       class="form-control"
                       th:field="*{title}"
                       placeholder="책 제목 입력">
                <div class="text-danger"
                     th:if="${#fields.hasErrors('title')}"
                     th:errors="*{title}">
                </div>
            </div>

            <!-- 저자 -->
            <div class="mb-3">
                <label class="form-label">저자</label>
                <input type="text"
                       class="form-control"
                       th:field="*{author}"
                       placeholder="저자 이름 입력">
                <div class="text-danger"
                     th:if="${#fields.hasErrors('author')}"
                     th:errors="*{author}">
                </div>
            </div>

            <!-- 수량 -->
            <div class="mb-3">
                <label class="form-label">수량</label>
                <input type="number"
                       class="form-control"
                       th:field="*{quantity}"
                       min="0"
                       placeholder="재고 수량 입력">
                <div class="text-danger"
                     th:if="${#fields.hasErrors('quantity')}"
                     th:errors="*{quantity}">
                </div>
            </div>

            <!-- 버튼 -->
            <div class="d-flex justify-content-between mt-4">
                <a th:href="@{/books/{bookId}(bookId=${book.id})}"
                   class="btn btn-secondary">
                    취소
                </a>

                <button type="submit"
                        class="btn btn-primary">
                    저장
                </button>
            </div>

        </form>
    </div>
</div>

</body>
</html>
