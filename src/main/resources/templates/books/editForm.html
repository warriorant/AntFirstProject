<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>도서 수정</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4">

        <h3 class="mb-4">✏️ 도서 수정</h3>

        <!--
          나중에 여기 form에 th:action="@{/books/{bookId}/edit(...)}"
          th:object="${book}"
          method="post"
          붙이면 됨
        -->
        <form th:action="@{/books/{bookId}/edit(bookId=${book.id})}" th:object="${book}" method="post">

            <!-- ID (보통 수정 불가) -->
            <div class="mb-3">
                <label class="form-label">ID</label>
                <input type="text"
                       class="form-control"
                       th:field="*{id}"
                       readonly>
            </div>

            <!-- 제목 -->
            <div class="mb-3">
                <label class="form-label">제목</label>
                <input type="text"
                       class="form-control"
                       th:field="*{title}"
                       >
            </div>

            <!-- 저자 -->
            <div class="mb-3">
                <label class="form-label">저자</label>
                <input type="text"
                       class="form-control"
                       th:field="*{author}"
                >
            </div>

            <!-- 상태 (선택: 지금은 보여주기만 / 나중에 select로 바꿔도 됨) -->
            <div class="mb-3">
                <label class="form-label">상태</label>
                <input type="text"
                       class="form-control"
                       th:field="*{status}"
                       readonly>
            </div>

            <!-- 버튼 -->
            <div class="d-flex justify-content-between mt-4">
                <a th:href="@{/books/{bookId}(bookId=${book.id})}" class="btn btn-secondary">
                    취소
                </a>

                <button type="submit" class="btn btn-primary">
                    저장
                </button>
            </div>

        </form>

    </div>

</div>

</body>
</html>
