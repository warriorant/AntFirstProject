<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>도서 등록</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow p-4">

        <h3 class="mb-4">📚 도서 등록</h3>

        <!-- th:object = Book 객체 바인딩 -->
        <form th:action="@{/books/add}" th:object="${book}" method="post">
            <!-- 제목 -->
            <div class="mb-3">
                <label class="form-label">제목</label>
                <input type="text"
                       th:field="*{title}"
                       class="form-control"
                       placeholder="책 제목 입력">
            </div>
            <!-- 저자 -->
            <div class="mb-3">
                <label class="form-label">저자</label>
                <input type="text"
                       th:field="*{author}"
                       class="form-control"
                       placeholder="저자 이름 입력">
            </div>
            <!-- 수량 -->
            <div class="mb-3">
                <label class="form-label">수량</label>
                <input type="number"
                       th:field="*{quantity}"
                       class="form-control"
                       placeholder="재고 수량 입력"
                       min="0">
            </div>
            <!-- 버튼 -->
            <div class="d-flex justify-content-between">
                <a th:href="@{/books}" class="btn btn-secondary">
                    목록으로
                </a>
                <button type="submit" class="btn btn-primary">
                    등록
                </button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
